<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Vault</title>
<meta name="description" content="A live demo trading desk run by AI agents: every strategy tested before it trades. Read-only.">
<style>
  :root { --bg:#141414; --card:#1c1c1c; --text:#e8e6e3; --muted:#9a9894; --accent:#8b7cf6; --line:#2a2a2a; }
  @media (prefers-color-scheme: light) { :root { --bg:#f6f5f2; --card:#fff; --text:#1b1b1b; --muted:#6b6966; --accent:#5b4bd6; --line:#e4e2dd; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--text);
         font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  .card { max-width:420px; width:100%; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:600; font-size:17px; }
  .gem { width:22px; height:22px; border-radius:6px; background:linear-gradient(135deg, var(--accent), #c9b8ff); }
  p { color:var(--muted); margin:14px 0 0; }
  a.btn { display:inline-block; margin-top:18px; padding:9px 16px; border-radius:8px; background:var(--accent); color:#fff; text-decoration:none; font-weight:600; }
  .err { display:none; }
</style>
</head>
<body>
<main class="card">
  <div class="brand"><div class="gem"></div>Agent Vault</div>
  <p id="msg">Opening the live desk…</p>
  <p>A demo trading desk run by AI agents. Every strategy is tested before it trades, and every result is shown. Read-only.</p>
  <a class="btn" id="go" href="#" hidden>Open the live desk</a>
  <p class="err" id="err">The live desk is restarting. Try again in a minute.</p>
  <noscript><p>This page needs JavaScript to find the current address of the live desk.</p></noscript>
</main>
<script>
// The desk runs behind a tunnel whose address can change; current.json always holds the live one.
fetch("current.json?t=" + Date.now(), { cache: "no-store" })
  .then(r => r.json())
  .then(d => {
    const go = document.getElementById("go");
    go.href = d.url; go.hidden = false;
    location.replace(d.url);
  })
  .catch(() => { document.getElementById("msg").hidden = true; document.getElementById("err").style.display = "block"; });
</script>
</body>
</html>
